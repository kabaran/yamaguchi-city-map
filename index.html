<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>山口県地域コミュニティ施設位置図</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font-family: sans-serif; }
    header { padding: 12px 16px; }
    h1 { margin: 0; font-size: 20px; }
    #status { margin: 6px 0 0; font-size: 14px; }
    #map { flex: 1; min-height: 250px; }
    .leaflet-popup-content { line-height: 1.8; }
    #search-wrap { position: relative; margin-top: 8px; max-width: 420px; }
    #search-box {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 16px;
      border: 1px solid #999;
      border-radius: 4px;
    }
    #search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #999;
      border-top: none;
      max-height: 260px;
      overflow-y: auto;
      z-index: 2000;
      display: none;
    }
    #search-results div {
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }
    #search-results div:hover,
    #search-results div:focus {
      background: #eef4ff;
    }
    #search-results .hit-address {
      font-size: 12px;
      color: #555;
    }
    .popup-topic {
      margin-top: 6px;
      padding: 6px 8px;
      background: #fff8e1;
      border-left: 3px solid #eda100;
      font-size: 13px;
      line-height: 1.5;
      max-width: 240px;
    }
    .popup-h { margin-top: 6px; font-size: 12px; color: #555; border-bottom: 1px solid #ddd; }
    .popup-warn { margin-top: 6px; padding: 6px 8px; background: #fff3a8; border: 2px solid #e0b800; font-size: 13px; line-height: 1.5; max-width: 260px; }
    #pref-status { margin-top: 8px; font-size: 14px; max-width: 720px; }
    #pref-status details { margin-top: 4px; }
    #pref-status summary { cursor: pointer; font-weight: bold; }
    #pref-status li { margin: 2px 0; }
    #pref-status .st-skip, #pref-status .st-unchecked { color: #8a5a00; }
  </style>
</head>
<body>
  <header>
    <h1>山口県地域コミュニティ施設位置図</h1>
    <p id="status" role="status">地点データを読み込み中です。</p>
    <p style="margin:8px 0 0"><label>市町を選ぶ：<select id="muni" style="font-size:16px;padding:4px 6px"><option value="">山口県全体</option></select></label></p>
    <div id="search-wrap">
      <input
        type="search"
        id="search-box"
        placeholder="施設名・住所で検索（例：井関、秋穂、湯田）"
        autocomplete="off"
      >
      <div id="search-results" role="listbox"></div>
    </div>
    <div id="pref-status"></div>
  </header>
  <div id="map" aria-label="地域コミュニティ施設の地図"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const status = document.getElementById("status");

    async function showMap() {
      try {
        const map = L.map("map", { zoomControl: false }).setView([34.18, 131.47], 11);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const response = await fetch("./mapdata.geojson");
        if (!response.ok) throw new Error("データを取得できません");
        const data = await response.json();
        const prefResponse = await fetch("./centers_pref.geojson");
        if (!prefResponse.ok) throw new Error("データを取得できません");
        const prefData = await prefResponse.json();

        const jichikaiResponse = await fetch("./jichikai_pref.geojson");
        if (!jichikaiResponse.ok) throw new Error("データを取得できません");
        const jichikaiPrefData = await jichikaiResponse.json();
        const kominkanResponse = await fetch("./kominkan_pref.geojson");
        if (!kominkanResponse.ok) throw new Error("データを取得できません");
        const kominkanPrefData = await kominkanResponse.json();

        ["./status_centers.json", "./status_kominkan.json", "./status_jichikai.json"].forEach(function (u) {
          fetch(u).then((r) => r.json()).then(function (st) {
            const label = { ok: "表示", skip: "未対応", none: "該当なし", unchecked: "未対応" };
            const det = document.createElement("details");
            const sum = document.createElement("summary");
            sum.textContent = st.layer + "：山口県の市町ごとの対応状況";
            const note = document.createElement("p");
            note.textContent = st.note + "（調査日 " + st.checked + "）";
            const ul = document.createElement("ul");
            st.municipalities.forEach(function (m) {
              const li = document.createElement("li");
              li.className = "st-" + m.status;
              li.textContent = m.name + "【" + label[m.status] + "】" + m.text;
              ul.appendChild(li);
            });
            det.append(sum, note, ul);
            document.getElementById("pref-status").appendChild(det);
          }).catch(function () {});
        });

        function buildPopup(feature) {
          const properties = feature.properties || {};
          const popup = document.createElement("div");
          const name = document.createElement("strong");
          const address = document.createElement("div");

          name.textContent = properties.name || "名称なし";
          address.textContent =
            properties["所在地_連結表記"] || "住所の情報がありません";

          popup.append(name, address);

          if (properties["お知らせ・話題"]) {
            const topic = document.createElement("div");
            topic.className = "popup-topic";
            topic.textContent = "📰 " + properties["お知らせ・話題"];
            popup.append(topic);
          }

          if (/（山口市以外）$/.test(properties["データ区分"] || "")) {
            const add = function (head, text) {
              if (!text) return;
              const h = document.createElement("div");
              h.className = "popup-h";
              h.textContent = head;
              const t = document.createElement("div");
              t.textContent = text;
              popup.append(h, t);
            };
            add("電話", properties["電話番号"]);
            add("出典", properties["出典"] + "（" + properties["情報更新日"] + "時点）");
            add("備考", properties["備考"]);
            const warn = document.createElement("div");
            warn.className = "popup-warn";
            warn.textContent = (properties["位置の根拠"] || "").startsWith("ユーザー提供")
              ? "位置はユーザー提供の座標です（Googleマップ）。現地は未確認です。"
              : "⚠ 位置は住所からの推定で、現地は未確認です。（" + properties["位置の精度"] + "）";
            popup.append(warn);
          }

          if (properties.URL) {
            const homepageLink = document.createElement("a");
            homepageLink.href = properties.URL;
            homepageLink.target = "_blank";
            homepageLink.rel = "noopener noreferrer";
            homepageLink.textContent = "ホームページ";
            popup.append(document.createElement("br"), homepageLink);
          }

          const coords = feature.geometry && feature.geometry.coordinates;
          if (coords) {
            const [lng, lat] = coords;
            const streetViewLink = document.createElement("a");
            streetViewLink.href =
              `https://www.google.com/maps?q=${lat},${lng}&ll=${lat},${lng}&z=18`;
            streetViewLink.target = "_blank";
            streetViewLink.rel = "noopener noreferrer";
            streetViewLink.textContent = "Googleマップで見る（ストリートビュー可）";
            popup.append(document.createElement("br"), streetViewLink);
          }

          return popup;
        }

        function isJichikaiKoukaidou(feature) {
          const properties = feature.properties || {};
          return properties["データ区分"] === "自治会公会堂(発見分・網羅性なし)";
        }

        function isNinchishouCafe(feature) {
          const properties = feature.properties || {};
          return properties["データ区分"] === "認知症カフェ";
        }

        function isKominkan(feature) {
          const properties = feature.properties || {};
          if (isJichikaiKoukaidou(feature) || isNinchishouCafe(feature)) return false;
          return (
            (properties.name || "").includes("公民館") ||
            Boolean(properties["データ区分"])
          );
        }

        const koukaidouData = {
          type: "FeatureCollection",
          features: data.features.filter(isJichikaiKoukaidou)
        };
        const ninchishouCafeData = {
          type: "FeatureCollection",
          features: data.features.filter(isNinchishouCafe)
        };
        const kominkanData = {
          type: "FeatureCollection",
          features: data.features.filter(isKominkan)
        };
        const mainData = {
          type: "FeatureCollection",
          features: data.features.filter(
            (f) => !isKominkan(f) && !isJichikaiKoukaidou(f) && !isNinchishouCafe(f)
          )
        };

        let curMuni = "";
        function muniOf(f) {
          const pr = f.properties || {};
          const m = (pr["地方公共団体名"] || pr["所在地_連結表記"] || "").match(/^山口県\s*(?:[^\s市町]+郡)?(.+?[市町])/);
          return m ? m[1] : "山口市";
        }
        function muniFilter(f) { return !curMuni || muniOf(f) === curMuni; }

        const prefJichikaiLayer = L.geoJSON(jichikaiPrefData, {
          filter: muniFilter,
          pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 8, color: "#b35900", fillColor: "#ffb866", fillOpacity: 0.9, weight: 2
            });
          },
          onEachFeature: function (feature, layer) {
            layer.bindPopup(buildPopup(feature));
          }
        }).addTo(map);

        const prefKominkanLayer = L.geoJSON(kominkanPrefData, {
          filter: muniFilter,
          pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 8, color: "#2e7d32", fillColor: "#8fd694", fillOpacity: 0.9, weight: 2
            });
          },
          onEachFeature: function (feature, layer) {
            layer.bindPopup(buildPopup(feature));
          }
        }).addTo(map);

        const prefCenterLayer = L.geoJSON(prefData, {
          filter: muniFilter,
          pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 8, color: "#1d5fa8", fillColor: "#6fb1f5", fillOpacity: 0.9, weight: 2
            });
          },
          onEachFeature: function (feature, layer) {
            layer.bindPopup(buildPopup(feature));
          }
        }).addTo(map);

        const mainLayer = L.geoJSON(mainData, {
          filter: muniFilter,
          onEachFeature: function (feature, layer) {
            layer.bindPopup(buildPopup(feature));
          }
        }).addTo(map);

        const kominkanLayer = L.geoJSON(kominkanData, {
          filter: muniFilter,
          pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 8,
              color: "#b8860b",
              fillColor: "#ffcc33",
              fillOpacity: 0.9,
              weight: 2
            });
          },
          onEachFeature: function (feature, layer) {
            layer.bindPopup(buildPopup(feature));
          }
        }).addTo(map);

        const koukaidouLayer = L.geoJSON(koukaidouData, {
          filter: muniFilter,
          pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 8,
              color: "#6b3fa0",
              fillColor: "#b98cf2",
              fillOpacity: 0.9,
              weight: 2
            });
          },
          onEachFeature: function (feature, layer) {
            layer.bindPopup(buildPopup(feature));
          }
        }).addTo(map);

        const ninchishouCafeLayer = L.geoJSON(ninchishouCafeData, {
          filter: muniFilter,
          pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 8,
              color: "#a0152e",
              fillColor: "#ff6f91",
              fillOpacity: 0.9,
              weight: 2
            });
          },
          onEachFeature: function (feature, layer) {
            layer.bindPopup(buildPopup(feature));
          }
        }).addTo(map);

        L.control.layers(null, {
          "地域交流センター等（山口市）": mainLayer,
          "地域交流センター（山口市以外・位置は推定）": prefCenterLayer,
          "公民館（山口市）": kominkanLayer,
          "公民館（山口市以外・位置は推定）": prefKominkanLayer,
          "自治会館・集会所（山口市以外・投票所一覧より・網羅性なし）": prefJichikaiLayer,
          "見つかった公会堂（網羅性なし）": koukaidouLayer,
          "認知症カフェ": ninchishouCafeLayer
        }, { collapsed: false }).addTo(map);

        const layerDefs = [
          [prefCenterLayer, prefData], [prefKominkanLayer, kominkanPrefData], [prefJichikaiLayer, jichikaiPrefData], [mainLayer, mainData], [kominkanLayer, kominkanData],
          [koukaidouLayer, koukaidouData], [ninchishouCafeLayer, ninchishouCafeData]
        ];
        const searchIndex = [];
        function rebuildIndex() {
          searchIndex.length = 0;
          layerDefs.forEach(function (d) {
            d[0].eachLayer(function (layer) {
              searchIndex.push({ feature: layer.feature, layer, parentLayer: d[0] });
            });
          });
        }
        rebuildIndex();

        const searchBox = document.getElementById("search-box");
        const searchResults = document.getElementById("search-results");

        function renderResults(query) {
          const q = query.trim();
          if (!q) {
            searchResults.style.display = "none";
            searchResults.innerHTML = "";
            return;
          }

          const matches = searchIndex.filter(function (entry) {
            const properties = entry.feature.properties || {};
            const name = properties.name || "";
            const address = properties["所在地_連結表記"] || "";
            return name.includes(q) || address.includes(q);
          }).slice(0, 15);

          searchResults.innerHTML = "";
          if (matches.length === 0) {
            const empty = document.createElement("div");
            empty.textContent = "該当する施設が見つかりません。";
            searchResults.appendChild(empty);
          } else {
            matches.forEach(function (entry) {
              const properties = entry.feature.properties || {};
              const row = document.createElement("div");
              row.setAttribute("role", "option");
              row.tabIndex = 0;

              const nameEl = document.createElement("div");
              nameEl.textContent = properties.name || "名称なし";
              const addrEl = document.createElement("div");
              addrEl.className = "hit-address";
              addrEl.textContent = properties["所在地_連結表記"] || "";

              row.append(nameEl, addrEl);

              const select = function () {
                if (!map.hasLayer(entry.parentLayer)) {
                  map.addLayer(entry.parentLayer);
                }
                map.setView(entry.layer.getLatLng(), 17, { animate: false });
                entry.layer.openPopup();
                searchResults.style.display = "none";
              };
              row.addEventListener("click", select);
              row.addEventListener("keydown", function (e) {
                if (e.key === "Enter") select();
              });

              searchResults.appendChild(row);
            });
          }
          searchResults.style.display = "block";
        }

        searchBox.addEventListener("input", function () {
          renderResults(searchBox.value);
        });
        searchBox.addEventListener("focus", function () {
          if (searchBox.value.trim()) renderResults(searchBox.value);
        });
        document.addEventListener("click", function (e) {
          if (!document.getElementById("search-wrap").contains(e.target)) {
            searchResults.style.display = "none";
          }
        });

        function fitAll() {
          const bounds = L.latLngBounds([]);
          layerDefs.forEach(function (d) {
            if (d[0].getBounds().isValid()) bounds.extend(d[0].getBounds());
          });
          if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
        }
        fitAll();

        // 市町を選ぶ
        const muniSel = document.getElementById("muni");
        const munis = ["下関市","宇部市","山口市","萩市","防府市","下松市","岩国市","光市","長門市","柳井市","美祢市","周南市","山陽小野田市","周防大島町","和木町","上関町","田布施町","平生町","阿武町"];
        munis.forEach(function (m) {
          const o = document.createElement("option");
          o.value = m;
          o.textContent = m;
          muniSel.appendChild(o);
        });
        muniSel.addEventListener("change", function () {
          curMuni = muniSel.value;
          layerDefs.forEach(function (d) {
            d[0].clearLayers();
            d[0].addData(d[1]);
          });
          rebuildIndex();
          searchBox.value = "";
          searchResults.style.display = "none";
          const n = searchIndex.length;
          if (n === 0) {
            status.textContent = curMuni + "：地図に出せる施設がまだありません（未対応の層があります。下の「対応状況」を見てください）。";
          } else {
            status.textContent = (curMuni || "山口県全体") + "：" + n + "件を表示中です。";
            fitAll();
          }
        });

        status.textContent = "ピンを押すと、施設名と住所が表示されます。右上でレイヤーの表示を切り替えられます。";
      } catch (error) {
        status.textContent =
          "地図を読み込めませんでした。通信状態と地図データの保存を確認してください。";
        console.error(error);
      }
    }

    showMap();
  </script>
</body>
</html>
